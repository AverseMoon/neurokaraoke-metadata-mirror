name: Daily Refresh

on:
    schedule:
        - cron: '0 0 * * *'
    workflow_dispatch:

jobs:
    songs:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4
    
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
    
            - name: Install dependencies
              run: npm install
    
            - name: Generate database
              run: node songs.js

            - name: Commit changes
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                
                  git diff --quiet artifacts/ && exit 0

                  git add artifacts/
            
                  git commit -m "Update songs database"
                  git push
    art:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4
    
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
    
            - name: Install dependencies
              run: npm install
    
            - name: Generate database
              run: node art.js

            - name: Commit changes
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  git add artifacts/
                
                  if git diff --quiet; then
                      echo "No changes"
                      exit 0
                  fi
            
                  git commit -m "Update art database"
                  git push
